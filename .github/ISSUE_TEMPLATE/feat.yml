name: "✨ 기능 요청"
description: 새로운 기능을 제안합니다
labels: ["feat"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 기능 요약
      description: 어떤 기능이 필요한지 간략히 설명해주세요
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 배경 및 동기
      description: 왜 이 기능이 필요한가요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 구현 방향 (선택)
      description: 구체적인 구현 아이디어가 있다면 적어주세요

  - type: textarea
    id: related
    attributes:
      label: 관련 이슈 / 문서
      description: 참고할 이슈, PR, 문서 링크가 있다면 적어주세요
