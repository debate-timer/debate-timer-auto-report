name: "🚨 긴급 수정"
description: 프로덕션 긴급 수정이 필요한 이슈를 제보합니다
labels: ["hotfix"]
body:
  - type: markdown
    attributes:
      value: |
        > **주의:** hotfix 브랜치는 `main`에서 직접 분기하고, 완료 후 `main`과 `develop` **양쪽**에 PR을 올려야 합니다.

  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 프로덕션에서 발생한 문제를 설명해주세요
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 어떤 기능/사용자에게 영향을 미치고 있나요?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
    validations:
      required: true

  - type: textarea
    id: proposed_fix
    attributes:
      label: 수정 방향 (선택)
      description: 빠른 수정 방향이 있다면 적어주세요
