name: "⚙️ CI/CD"
description: GitHub Actions 또는 배포 파이프라인 관련 작업입니다
labels: ["ci"]
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 어떤 CI/CD 변경이 필요한가요?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 이유 / 배경
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 배포 영향 (선택)
      description: 파이프라인 변경으로 인한 배포 영향이 있다면 적어주세요
